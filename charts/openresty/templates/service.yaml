apiVersion: v1
kind: Service
metadata:
  name: {{ include "openresty.fullname" . }}
  labels: {{- include "openresty.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "openresty.selectorLabels" . | nindent 4 }}
    {{- if .Values.ha.enabled }}
    # Only the replica ha-gate has marked active is selected, so the standby
    # stays out of the endpoints until it wins the Lease.
    {{ include "openresty.name" . }}-active: "true"
    {{- end }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .port }}
    {{- end }}
