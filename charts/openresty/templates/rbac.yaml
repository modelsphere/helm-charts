{{- if .Values.ha.enabled }}
# What ha-gate needs to run the master/standby pair: hold the Lease it elects on,
# and patch the active label on its own pod -- that label is what the Service
# selects, so it is the gate deciding which replica takes traffic.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openresty.fullname" . }}-ha
  labels: {{- include "openresty.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openresty.fullname" . }}-ha
  labels: {{- include "openresty.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openresty.fullname" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openresty.fullname" . }}-ha
{{- end }}
