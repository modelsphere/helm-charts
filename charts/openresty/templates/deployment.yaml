{{- /* Which Secret holds the API keys, or "" for none (authentication off).
       existingSecret wins over secret.create, so production can point at a Secret
       created out of band and keep the keys out of git entirely.
       Defined at file scope on purpose: it is used by the openresty container, the
       reload sidecar and the volumes list, and a variable defined inside one of
       those blocks would not be visible in the others. */}}
{{- $sec := .Values.existingSecret | default (ternary (include "openresty.fullname" .) "" .Values.secret.create) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openresty.fullname" . }}
  labels: {{- include "openresty.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- with .Values.updateStrategy }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .maxSurge }}
      maxUnavailable: {{ .maxUnavailable }}
  {{- end }}
  selector:
    matchLabels: {{- include "openresty.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openresty.selectorLabels" . | nindent 8 }}
        {{- /* Pod labels only, never the selector above: a Deployment's selector
               is immutable and changing it fails the upgrade. See values.yaml. */}}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.terminationGracePeriodSeconds }}
      # The hard cutoff for draining. The image sets STOPSIGNAL SIGQUIT, so nginx
      # stops accepting and lets in-flight streams finish until this expires.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.ha.enabled }}
      serviceAccountName: {{ include "openresty.fullname" . }}   # ha-gate uses it to hold the Lease
      {{- end }}
      {{- if .Values.reload.enabled }}
      shareProcessNamespace: true   # lets the reload sidecar send SIGHUP to the nginx master
      {{- end }}
      containers:
        - name: openresty
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.bodylog.host }}
          {{- /* Where to ship captured bodies. The image ships these unset, and
                 unset means body logging is off -- there is no fallback address
                 by design, so leaving bodylog.host empty captures nothing. */}}
          env:
            - { name: BODYLOG_LISTENER_HOST, value: {{ .Values.bodylog.host | quote }} }
            - { name: BODYLOG_LISTENER_PORT, value: {{ .Values.bodylog.port | quote }} }
          {{- end }}
          {{- /* API keys are mounted as a file (see the volumeMounts below), not injected
                 as an environment variable: nginx re-reads files on reload but never
                 re-reads `env`, so a mounted Secret can be rotated with a graceful
                 reload instead of restarting the master. The reload sidecar watches the
                 mount directory as a second --watch path. */}}
          {{- if gt (int .Values.preStop.sleepSeconds) 0 }}
          lifecycle:
            preStop:
              # Wait for this pod's removal from the Service endpoints to reach
              # every node before nginx closes its listener, so nothing new
              # arrives after it has stopped accepting.
              exec: { command: ["/bin/sh", "-c", "sleep {{ .Values.preStop.sleepSeconds }}"] }
          {{- end }}
          ports:
            {{- range .Values.service.ports }}
            - containerPort: {{ .port }}   # 8080 dispatch and 8090 health/admin both come from service.ports
            {{- end }}
          volumeMounts:
            - name: routes                                                    # per-route configs, mounted as a whole volume
              mountPath: /usr/local/openresty/nginx/conf/conf.d/routes
            - name: route-sock                                                # unix sockets the dispatcher forwards to; shared with reload
              mountPath: /usr/local/openresty/nginx/sock
            {{- if $sec }}
            {{- /* Whole-volume mount, never subPath: a Secret update swaps the ..data
                   symlink, which a subPath mount does not follow -- it copies the file
                   once and then goes stale, so rotation would silently stop working.
                   Its own directory rather than joining conf.d/routes, which the route
                   writer owns and rewrites. Path matches api_keys.lua's DEFAULT_PATH. */}}
            - name: api-keys
              mountPath: /etc/openresty/api-keys
              readOnly: true
            {{- end }}
          {{- if .Values.probes.enabled }}
          startupProbe:                     # startup budget: no liveness/readiness verdict until the admin port answers
            httpGet: { path: /healthz, port: {{ .Values.adminPort }} }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                    # only active after startup succeeds, so it can be snappy without killing a slow start
            httpGet: { path: /healthz, port: {{ .Values.adminPort }} }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:                   # ready as soon as the admin port answers; which replica takes traffic is ha-gate's call
            httpGet: { path: /healthz, port: {{ .Values.adminPort }} }
            periodSeconds: 2
            failureThreshold: 2
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.reload.enabled }}
        - name: reload
          image: {{ .Values.reload.image }}
          # --sock-dir lets it clear orphaned <name>.sock files left behind when a
          # route is removed, before reloading.
          # The route-conf mount MUST stay the first --watch: the sidecar scopes its
          # orphan-socket *.conf scan to that first path.
          args:
            - "--watch"
            - "/watch"
            {{- if $sec }}
            - "--watch"                     # API-key Secret: a key change reloads nginx, no master restart
            - "/keys"
            {{- end }}
            - "--process"
            - {{ .Values.reload.process | quote }}
            - "--sock-dir"
            - "/usr/local/openresty/nginx/sock"
          volumeMounts:
            - name: routes
              mountPath: /watch
            - name: route-sock                                                # same socket directory as the router
              mountPath: /usr/local/openresty/nginx/sock
            {{- if $sec }}
            - name: api-keys                                                  # watched for changes only; contents are never read here
              mountPath: /keys
              readOnly: true
            {{- end }}
        {{- end }}
        {{- if .Values.ha.enabled }}
        - name: hagate                       # master/standby: only the leader labels itself active, so only it is in the Service
          image: {{ .Values.ha.image }}
          args: ["--lease", "{{ include "openresty.fullname" . }}-ha", "--http", ":{{ .Values.ha.port }}", "--app-tcp", {{ .Values.ha.appTcp | quote }}, "--label-key", "{{ include "openresty.name" . }}-active"]
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
        {{- end }}
      volumes:
        - name: routes
          configMap:
            name: {{ .Values.configMapName }}
        - name: route-sock                     # dispatcher sockets: per-pod, created by the router and pruned by reload
          emptyDir: {}
        {{- if $sec }}
        - name: api-keys                       # entry-point keys, mounted as a file so a reload can rotate them
          secret:
            secretName: {{ $sec }}
        {{- end }}
      {{- if or .Values.affinity .Values.ha.enabled }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:                     # prefer separate nodes for the pair; soft, so a single-node cluster still works
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "openresty.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
