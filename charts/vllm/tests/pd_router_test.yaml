# The PD router runs `vllm-router` off its own image, in both PD shapes. The engine
# image has no vllm-router, so an emptied override falls back to vllm-router, never
# to the engine.
#
# The boot script and the drift liveness probe share a state dir. A mismatch is
# silent, because the probe treats a missing snapshot as "still booting" and
# passes, so drift detection would just stop working. Hence the path asserts on both.
suite: pd router
release:
  name: ci
  namespace: ci
set:
  modelRoute.nginx.outputConfigMap: ci/openresty-conf
  pd.enabled: true
  rdma.enabled: true
  scaler.enabled: false
  pd.prefill.gpus: 8
  pd.decode.gpus: 8
  model.localPath: /models/x
tests:
  - it: pd-ds router defaults to the pinned vllm-router image; its init container to debian
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].image
          value: vllm/vllm-router:v0.1.16.1
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "wait-upstreams")].image
          value: debian:12-slim

  - it: pd-ds router execs vllm-router and keeps its state dir where non-root can write
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: 'exec vllm-router \\\n\s+--vllm-pd-disaggregation'
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: '/run/pd-router'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: 'mkdir -p /tmp/pd-router'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: 'mv "\$T" "/tmp/pd-router/\$\{role\}-ips"'

  - it: pd-ds liveness probe reads the state dir the boot script writes
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].livenessProbe.exec.command[2]
          pattern: 'file="/tmp/pd-router/\$3"'

  - it: pd-ds router override wins over the default and leaves the init container alone
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    set:
      pd.router.imageOverride.repository: registry.example.com/mirror/vllm-router
      pd.router.imageOverride.tag: v0.1.17
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].image
          value: registry.example.com/mirror/vllm-router:v0.1.17
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "wait-upstreams")].image
          value: debian:12-slim

  - it: colocate router runs vllm-router while its engines stay on the engine image
    template: templates/pd-colocate.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      pd.colocate: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].image
          value: vllm/vllm-router:v0.1.16.1
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: 'exec vllm-router \\\n\s+--vllm-pd-disaggregation'
      - equal:
          path: spec.template.spec.containers[?(@.name == "vllm")].image
          value: vllm/vllm-openai:latest-cu129-ubuntu2404
      - equal:
          path: spec.template.spec.containers[?(@.name == "vllm1")].image
          value: vllm/vllm-openai:latest-cu129-ubuntu2404

  - it: pd-ds emptied override falls back to vllm-router, not the engine image
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    set:
      pd.router.imageOverride.repository: ""
      pd.router.imageOverride.tag: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].image
          value: vllm/vllm-router:v0.1.16.1
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "wait-upstreams")].image
          value: debian:12-slim

  - it: colocate emptied override falls back to vllm-router, not the engine image
    template: templates/pd-colocate.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      pd.colocate: true
      pd.router.imageOverride.repository: ""
      pd.router.imageOverride.tag: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].image
          value: vllm/vllm-router:v0.1.16.1

  - it: wait-upstreams image can be mirrored without touching the router
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    set:
      pd.router.waitUpstreamsImage.repository: registry.example.com/mirror/debian
      pd.router.waitUpstreamsImage.tag: 12-slim-pinned
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "wait-upstreams")].image
          value: registry.example.com/mirror/debian:12-slim-pinned
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].image
          value: vllm/vllm-router:v0.1.16.1

  - it: emptied wait-upstreams image falls back to debian
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    set:
      pd.router.waitUpstreamsImage.repository: ""
      pd.router.waitUpstreamsImage.tag: ""
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "wait-upstreams")].image
          value: debian:12-slim

  # Engines healthy is not the router serving: the boot script blocks on every
  # upstream's identity before it execs vllm-router, so a scale-up with a
  # still-loading engine went Ready on the old engines and the rollout deleted
  # the working router. The router's own /readiness gates startup/readiness;
  # its /health would wait for EVERY worker. Liveness never sees the router.
  - it: pd-ds router startup/readiness also probe the router's own /readiness
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    set:
      service.port: 18123
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].readinessProbe.exec.command[2]
          pattern: 'check "127\.0\.0\.1" "18123" "/readiness" \|\| '
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].startupProbe.exec.command[2]
          pattern: 'check "127\.0\.0\.1" "18123" "/readiness" \|\| '
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].readinessProbe.exec.command[2]
          pattern: 'check "ci-prefill-hl-s0\.ci\.svc\.cluster\.local\." "8001" "/health" \|\| '
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].livenessProbe.exec.command[2]
          pattern: 'check "prefill" "ci-prefill-hl-s0\.ci\.svc\.cluster\.local\." prefill-ips "8001" "/health"'
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].livenessProbe.exec.command[2]
          pattern: '127\.0\.0\.1'

  # Shrink drift is exercised by hack/test-pd-router-probe.sh, which runs the
  # rendered probe against fake DNS and engines. This pins the one guard whose
  # loss would be fleet-wide: an empty answer for any role (resolver blip,
  # atomic re-roll) must never restart a router on shrink.
  - it: pd-ds liveness never acts on shrink while a role resolves empty
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].livenessProbe.exec.command[2]
          pattern: '\[ -n "\$resolved" \] && \[ "\$all_resolve" -eq 1 \] \|\| return 0\n'

  # An empty role at boot waits instead of exiting: exiting turned an engine
  # set that is not placed yet into CrashLoopBackOff, whose backoff then held
  # the router back after the engines came up. The startupProbe bounds it.
  - it: pd-ds router boot waits on an empty role without an attempt cap
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: 'i=0\n\s*while :; do\n\s*i=\$\(\(i\+1\)\)'
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: 'seq 1 60|exit 1'

  - it: pd-ds defaults to 2 router replicas with preStop drain, fast probes, and staggered peer liveness
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].startupProbe.failureThreshold
          value: 1080
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].readinessProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].readinessProbe.failureThreshold
          value: 2
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].readinessProbe.exec.command[2]
          pattern: '/tmp/pd-router/draining'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].readinessProbe.exec.command[2]
          pattern: 'timeout=2'
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].readinessProbe.exec.command[2]
          pattern: 'timeout=5'
      - equal:
          path: spec.template.spec.containers[?(@.name == "router")].lifecycle.preStop.exec.command[2]
          value: "mkdir -p /tmp/pd-router && touch /tmp/pd-router/draining && sleep 20"
      - contains:
          path: spec.template.spec.containers[?(@.name == "router")].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].livenessProbe.exec.command[2]
          pattern: 'ci-router-hl-s0\.ci\.svc\.cluster\.local\.'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].livenessProbe.exec.command[2]
          pattern: 'LC_ALL=C sort -u'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].livenessProbe.exec.command[2]
          pattern: '/tmp/pd-router/draining'

  - it: pd-ds renders a Ready-only headless Service for router peers
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-hl-s0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: false
      - equal:
          path: spec.selector
          value:
            app: ci-vllm
            component: router
            slice: "0"

  - it: pd-ds with pd.router.replicas=1 skips peer stagger in livenessProbe
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    set:
      pd.router.replicas: 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].livenessProbe.exec.command[2]
          pattern: 'ci-router-hl-s0'

  - it: pd-ds renders a minAvailable=1 router PDB by default
    template: templates/pdb.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: pd-ds sets publishNotReadyAddresses=false on prefill headless Service
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-prefill-hl-s0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: false
      - equal:
          path: spec.selector["disaggregatedset.x-k8s.io/role"]
          value: prefill

  - it: pd-ds sets publishNotReadyAddresses=false on decode headless Service
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-decode-hl-s0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: false
      - equal:
          path: spec.selector["disaggregatedset.x-k8s.io/role"]
          value: decode

  - it: pd-ds router resolves Ready-only role DNS at boot and passes crash-resilience flags to vllm-router
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: 'ci-prefill-hl-s0\.ci\.svc\.cluster\.local\.'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: 'ci-decode-hl-s0\.ci\.svc\.cluster\.local\.'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: '--disable-circuit-breaker'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: '--health-check-interval-secs 2'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: '--health-failure-threshold 2'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: '--health-check-timeout-secs 2'

  - it: colocate router passes crash-resilience flags to vllm-router without DS preStop router wait on engines
    template: templates/pd-colocate.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      pd.colocate: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: '--disable-circuit-breaker'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: '--health-check-interval-secs 2'
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "vllm")].lifecycle.preStop.exec.command[2]
          pattern: 'router-hl-s'

  - it: pd-ds prefill and decode leaders carry downward-API coords and router-eviction preStop
    template: templates/pd-ds.yaml
    documentSelector:
      path: kind
      value: DisaggregatedSet
    asserts:
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "vllm")].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "vllm")].env
          content:
            name: PD_SLICE
            valueFrom:
              fieldRef:
                fieldPath: "metadata.labels['disaggregatedset.x-k8s.io/slice']"
      - matchRegex:
          path: spec.roles[0].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "vllm")].lifecycle.preStop.exec.command[2]
          pattern: 'router-hl-s'
      - matchRegex:
          path: spec.roles[0].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "vllm")].lifecycle.preStop.exec.command[2]
          pattern: '/remove_worker'
      - matchRegex:
          path: spec.roles[1].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "vllm")].lifecycle.preStop.exec.command[2]
          pattern: '\{PD_ROLE\}-hl-s'
      - isNull:
          path: spec.roles[0].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "vllm")].lifecycle
