# The boot script and the drift liveness probe share a state dir. A mismatch is
# silent, because the probe treats a missing snapshot as "still booting" and
# passes, so drift detection would just stop working. Hence the path asserts on both.
suite: pd router state dir
release:
  name: ci
  namespace: ci
set:
  modelRoute.nginx.outputConfigMap: ci/openresty-conf
  pd.enabled: true
  rdma.enabled: true
  scaler.enabled: false
  pd.prefill.gpus: 8
  pd.decode.gpus: 8
  model.localPath: /models/x
tests:
  - it: boot script writes its snapshots under /tmp
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: 'mkdir -p /tmp/pd-router'
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: 'mv "\$T" "/tmp/pd-router/\$\{role\}-ips"'
      - notMatchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].args[0]
          pattern: '/run/pd-router'

  - it: liveness probe reads the state dir the boot script writes
    template: templates/pd-ds.yaml
    documentSelector:
      path: metadata.name
      value: ci-router-s0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name == "router")].livenessProbe.exec.command[2]
          pattern: 'file="/tmp/pd-router/\$3"'
