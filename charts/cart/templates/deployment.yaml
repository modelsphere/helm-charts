{{- include "cart.configOverlays.check" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {{- include "cart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cart.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}   # The hard cutoff -- SIGKILL at this point. CART forwards long SSE streams, so set it to the longest response you expect; the k8s default of 30s will cut them.
      {{- end }}
      {{- if .Values.ha.enabled }}
      serviceAccountName: {{ include "cart.fullname" . }}   # used by ha-gate to manage its Lease
      {{- end }}
      {{- if .Values.reload.enabled }}
      shareProcessNamespace: true
      {{- end }}
      {{- if .Values.waitForWorkers }}
      initContainers:
        # Wait for a real worker list (url: http://...) to appear before starting
        # CART, which refuses to start with an empty one and would crash-loop.
        # The pod sits in Init instead, and is released once the workers land or
        # after ~10 minutes. Reuses the CART image, so there is nothing extra to pull.
        - name: wait-workers
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          # Scans the base and every overlay, since the controller may write into
          # any of them. Do not tighten the pattern to [[:space:]]*http: -- that
          # misses quoted URLs.
          command: ["sh", "-c", "for i in $(seq 1 300); do grep -qE 'url:.*http' {{ include "cart.configFiles" . }} 2>/dev/null && { echo 'workers ready'; exit 0; }; echo \"[$i] waiting for workers...\"; sleep 2; done; echo 'timed out, starting anyway'; exit 0"]
          volumeMounts:
            - name: cfg
              mountPath: /workspace/configs
      {{- end }}
      containers:
        - name: cart
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "ulimit -n {{ .Values.ulimitNofile }}; exec ./launch_service \"$@\"", "--"]   # "$@" passes the args below through
          args:                         # load order is override order: later files win
            - "-c"
            - "/workspace/configs/config.yaml"
            {{- range .Values.configOverlays }}
            - "-c"
            - {{ printf "/workspace/configs/%s" .key | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: cfg               # base plus every overlay key, mounted as one volume
              mountPath: /workspace/configs
          {{- if .Values.probes.enabled }}
          startupProbe:                 # budget for a slow start: no live/ready checks until the port is up (~60s max)
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                # only after startup succeeds, so it can be aggressive about catching a wedge
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:               # the port is already up by then; which replica takes traffic is decided by the ha-active label
            tcpSocket: { port: {{ .Values.service.port }} }
            periodSeconds: 2
            failureThreshold: 2
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.reload.enabled }}
        - name: reload
          image: {{ .Values.reload.image }}
          args: ["--watch", "/workspace/configs", "--process", {{ .Values.reload.process | quote }}]
          volumeMounts:
            - name: cfg
              mountPath: /workspace/configs
        {{- end }}
        {{- if .Values.ha.enabled }}
        - name: hagate                  # only the leader labels itself cart-active, so only the leader is in the Service
          image: {{ .Values.ha.image }}
          args: ["--lease", "{{ include "cart.fullname" . }}-ha", "--http", ":{{ .Values.ha.port }}", "--app-tcp", {{ .Values.ha.appTcp | quote }}, "--label-key", "{{ include "cart.name" . }}-active"]
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
        {{- end }}
      volumes:
        - name: cfg
          configMap:
            name: {{ include "cart.configMapName" . }}   # the chart renders the base and the overlays; the controller fills in its own key
      {{- /* A custom affinity ADDS to the spread below rather than replacing it:
             setting only nodeAffinity (to pin CART to a class of node) keeps the
             podAntiAffinity, without which both replicas could land on one node
             and the standby would buy nothing. Write your own podAntiAffinity to
             change or disable the spread. */}}
      {{- $aff := deepCopy (.Values.affinity | default dict) }}
      {{- if and .Values.ha.enabled (not (hasKey $aff "podAntiAffinity")) }}
      {{- $spread := dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict
            "weight" 100
            "podAffinityTerm" (dict
              "topologyKey" "kubernetes.io/hostname"
              "labelSelector" (dict "matchLabels" (include "cart.selectorLabels" . | fromYaml))))) }}
      {{- $aff = set $aff "podAntiAffinity" $spread }}
      {{- end }}
      {{- with $aff }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
