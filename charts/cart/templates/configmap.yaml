{{- include "cart.configOverlays.check" . }}
# Holds the base config.yaml plus every overlay key.
# A key marked autoconfig is deliberately not rendered here: if the template
# never emits it, helm upgrade's three-way merge has nothing to write there, and
# the worker list the controller put in survives the upgrade.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cart.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cart.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ .Values.baseConfig | indent 4 }}
  {{- range .Values.configOverlays }}
  {{- if not .autoconfig }}
  {{ .key }}: |
{{ .content | default "" | indent 4 }}
  {{- end }}
  {{- end }}
