{{- if .Values.podDisruptionBudget.enabled -}}
{{- $pdb := .Values.podDisruptionBudget -}}
{{/*
  Disruption budgets for the ENGINE pods (and, under pd A/B, the per-slice
  routers). The CART subchart ships its own (charts/cart/templates/pdb.yaml)
  and is not touched by this one -- two workloads, two budgets.

  What this does and does not cover is the part worth being precise about,
  because the name suggests more than the object delivers:

    covered      the eviction API -- `kubectl drain`, the cluster-autoscaler
                 scaling a node down, a node being recycled by a platform
                 operator. These ASK, and this is the answer.
    best effort  scheduler preemption. A higher-priority pod may still take the
                 node; the scheduler tries not to violate a PDB and gives up on
                 that when it has no other choice.
    not covered  anything that does not go through eviction: a node crashing or
                 losing the kubelet, an OOM kill, a failing probe restarting a
                 container, the LWS controller recreating a group, and the
                 scaler scaling this fleet down. A PDB never keeps a replica
                 alive -- it only makes a voluntary disruption wait.

  It is also NOT the rollout guard. A `helm upgrade` replaces pods through the
  Deployment's own strategy (maxSurge / maxUnavailable) or lws.rolloutStrategy;
  neither consults this budget. If a rollout is taking down too much at once,
  those are the fields to change.

  Under lws.enabled the selector deliberately covers WORKERS as well as leaders.
  A worker looks disposable and is not: under RecreateGroupOnPodRestart, losing
  one takes its whole group down with it, so a budget that ignored workers would
  hand out a "safe" eviction that costs an entire instance. With every pod
  counted, maxUnavailable: 1 has a useful meaning -- at most one GROUP can be
  disrupted at a time, because the moment one pod goes the rest of its group
  follows and the budget is spent until the group is serving again.

  That also decides what a percentage means here: the disruption controller
  resolves the expected count through the LWS's StatefulSets, so it counts PODS,
  never groups. `minAvailable: 50%` on a single group of 2 is one pod, and one
  pod of a group is not half an instance -- it is a dead instance.
*/}}
{{- /*
     Exactly one of the two, which is an API-server rule rather than a taste:
     a PDB carrying both is rejected outright, and one carrying neither is
     rejected too.
*/ -}}
{{- $hasMin := and (not (kindIs "invalid" $pdb.minAvailable)) (ne (printf "%v" $pdb.minAvailable) "") -}}
{{- $hasMax := and (not (kindIs "invalid" $pdb.maxUnavailable)) (ne (printf "%v" $pdb.maxUnavailable) "") -}}
{{- if and $hasMin $hasMax }}
{{- fail (printf "sglang: podDisruptionBudget sets both minAvailable (%v) and maxUnavailable (%v), and the API server rejects a PDB carrying both. Empty the one you do not want -- maxUnavailable is the safer of the two under an autoscaler, see values.yaml" $pdb.minAvailable $pdb.maxUnavailable) }}
{{- end }}
{{- if not (or $hasMin $hasMax) }}
{{- fail "sglang: podDisruptionBudget.enabled is on but neither minAvailable nor maxUnavailable is set -- a PDB must carry exactly one of them. maxUnavailable: 1 is the chart default and reads as \"never take down more than one at a time\" whatever the replica count" }}
{{- end }}
{{- /*
     The smallest this fleet is ever allowed to get. Not a guess: it is the floor
     the chart itself renders -- scaler.minReplicas when the operator owns the
     count, replicaCount / lws.replicas when it does not -- and under LWS a
     replica is a whole group of lws.size pods, which is what the PDB counts.
*/ -}}
{{- /*
  Two shapes, two paths below:
    - pd A/B (pd.enabled and not pd.colocate): a DisaggregatedSet whose pods
      carry labels injected by the DS/LWS chain (the chart's own `app` label
      is rewritten by LWS), plus one router Deployment per slice. A single
      PDB keyed on `app` cannot address the engine pods at all on this
      shape -- so this branch renders one PDB per (role, slice) keyed on the
      DS-injected labels, and one per slice for the router.
    - everything else (Deployment, LWS, colocate): one PDB over the engine
      pods, keyed on `app: <release>-sglang`, which all the pods of those
      shapes do carry.
*/ -}}
{{- $pdAB := and .Values.pd.enabled (not .Values.pd.colocate) -}}
{{- $floor := 0 -}}
{{- $floorDesc := "" -}}
{{- if .Values.pd.enabled -}}
{{- /* Only colocate reaches this branch in the single-PDB path; A/B computes
       its own per-slice floor inside its loop below. */ -}}
{{- $floor = int .Values.replicaCount -}}
{{- $floorDesc = printf "replicaCount %d (colocate appliances)" $floor -}}
{{- else if .Values.lws.enabled -}}
{{- $groups := int (ternary .Values.scaler.minReplicas .Values.lws.replicas .Values.scaler.enabled) -}}
{{- $floor = mul $groups (int .Values.lws.size) -}}
{{- $floorDesc = printf "%d %s x lws.size %d" $groups (ternary "scaler.minReplicas" "lws.replicas" .Values.scaler.enabled) (int .Values.lws.size) -}}
{{- else -}}
{{- $floor = int (ternary .Values.scaler.minReplicas .Values.replicaCount .Values.scaler.enabled) -}}
{{- $floorDesc = printf "%s %d" (ternary "scaler.minReplicas" "replicaCount" .Values.scaler.enabled) $floor -}}
{{- end -}}
{{- if $hasMin }}
{{- /* Resolve a percentage the way the disruption controller does -- against the
       expected pod count, rounding UP -- so the check below sees the same number
       Kubernetes will. Integer ceil: (a*b + 99) / 100. */ -}}
{{- $raw := printf "%v" $pdb.minAvailable -}}
{{- $resolved := 0 -}}
{{- if hasSuffix "%" $raw -}}
{{- $resolved = div (add (mul $floor (atoi (trimSuffix "%" $raw))) 99) 100 -}}
{{- else -}}
{{- $resolved = atoi $raw -}}
{{- end -}}
{{- if and (not $pdAB) (gt $floor 0) (ge $resolved $floor) }}
{{- /*
     The trap this exists to catch. disruptionsAllowed is (healthy - minAvailable),
     so a minAvailable equal to the fleet's floor means zero allowed the moment
     the fleet sits at that floor -- and `kubectl drain` does not time out, it
     retries forever. Nothing resolves it either: the scaler adds replicas for
     traffic, not because a drain is waiting, so the node stays cordoned and
     half-drained until someone raises the number or deletes the PDB by hand.
     minAvailable: 1 on a single-replica release is the version of this mistake
     that everybody makes.
*/ -}}
{{- fail (printf "sglang: podDisruptionBudget.minAvailable (%v) resolves to %d pod(s) against a fleet floor of %d (%s), so no voluntary eviction is allowed at all once the fleet is at its floor -- a node drain would block indefinitely rather than wait, and nothing scales the fleet back up to unblock it. Use maxUnavailable: 1, which always permits exactly one disruption whatever the replica count -- or make the two agree: minAvailable strictly below the floor, or a floor (%s) above minAvailable" $pdb.minAvailable $resolved $floor $floorDesc (ternary "scaler.minReplicas" (ternary "lws.replicas x lws.size" "replicaCount" .Values.lws.enabled) .Values.scaler.enabled)) }}
{{- end }}
{{- end }}
{{- if $pdAB }}
{{- /*
     Under pd A/B a slice is the serving unit: its own prefill set, its own
     decode set, its own router in front. Each role therefore gets its own PDB
     per slice, and the router its own per slice -- drain parallelism is per
     slice (a maintenance pass touches at most one pod of each role in each
     slice at a time, never two of the same role in one slice), and the
     failure mode the budget encodes matches the failure mode the deployment
     has ("a slice is down", not "some pods somewhere are down").

     Selectors key on the labels the DisaggregatedSet controller injects into
     every engine pod it manages -- disaggregatedset.x-k8s.io/{name,role,slice}
     -- because the chart's own `app` label is NOT trustworthy on this shape:
     the LWS controller rewrites `app` on the leader/worker templates it
     stamps out, so an app-keyed PDB would silently match nothing. The router
     is a plain Deployment and does carry `app`, so its per-slice PDB keys on
     `app` + `component: router` + `slice`.

     No worker-index filter on the engine PDBs: under lws.restartPolicy
     RecreateGroupOnPodRestart losing one pod restarts the group, so
     maxUnavailable: 1 counted over pods reads as "at most one GROUP out at
     a time" -- the same trick the lws branch above uses.

     Router PDB: minAvailable: 1, only when pd.router.replicas >= 2. With one
     router there is no budget that makes sense (minAvailable: 1 would forbid
     all voluntary evictions of the only front door), so it is not rendered --
     same convention as the chart's single-replica default for engines.
*/ -}}
{{- $slices := int .Values.replicaCount -}}
{{- $fullname := include "sglang.fullname" . -}}
{{- range $s := until $slices }}
{{- range $role := tuple "prefill" "decode" }}
{{- $roleCfg := index $.Values.pd $role }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-{{ $role }}-s{{ $s }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-sglang
  {{- with $pdb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $hasMin }}
  {{- $raw := printf "%v" $pdb.minAvailable }}
  minAvailable: {{ if hasSuffix "%" $raw }}{{ $raw | quote }}{{ else }}{{ atoi $raw }}{{ end }}
  {{- else }}
  {{- $raw := printf "%v" $pdb.maxUnavailable }}
  maxUnavailable: {{ if hasSuffix "%" $raw }}{{ $raw | quote }}{{ else }}{{ atoi $raw }}{{ end }}
  {{- end }}
  {{- with $pdb.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      disaggregatedset.x-k8s.io/name: {{ $fullname }}
      disaggregatedset.x-k8s.io/role: {{ $role }}
      disaggregatedset.x-k8s.io/slice: {{ $s | quote }}
{{- end }}
{{- $routerReplicas := int ($.Values.pd.router.replicas | default 2) }}
{{- if ge $routerReplicas 2 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fullname }}-router-s{{ $s }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-sglang
  {{- with $pdb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  minAvailable: 1
  {{- with $pdb.unhealthyPodEvictionPolicy }}
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-sglang
      component: router
      slice: {{ $s | quote }}
{{- end }}
{{- end }}
{{- else }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sglang.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-sglang
  {{- with $pdb.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* Rendered bare for a count and quoted for a percentage: the field is an
         IntOrString, and a quoted "2" reaches the API server as the string "2",
         which it rejects for not being a percentage. */ -}}
  {{- if $hasMin }}
  {{- $raw := printf "%v" $pdb.minAvailable }}
  minAvailable: {{ if hasSuffix "%" $raw }}{{ $raw | quote }}{{ else }}{{ atoi $raw }}{{ end }}
  {{- else }}
  {{- $raw := printf "%v" $pdb.maxUnavailable }}
  maxUnavailable: {{ if hasSuffix "%" $raw }}{{ $raw | quote }}{{ else }}{{ atoi $raw }}{{ end }}
  {{- end }}
  {{- with $pdb.unhealthyPodEvictionPolicy }}
  # AlwaysAllow lets a pod that has never been Ready be evicted even while the
  # budget is unmet. Without it (the API default, IfHealthyBudget) a fleet that
  # is already short one replica cannot be drained at all -- and on this chart
  # "not Ready" is the normal state for the ~20 minutes a large model spends
  # loading, so the window where that bites is not a corner case.
  # Requires Kubernetes >= 1.27 (>= 1.26 behind a feature gate); an older API
  # server drops the field rather than failing, leaving the default behaviour.
  unhealthyPodEvictionPolicy: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      # Every engine pod of this release: the Deployment's, or -- under
      # lws.enabled -- both roles of every group. See the note above on why
      # workers are in here.
      app: {{ .Release.Name }}-sglang
{{- end }}
{{- end -}}
