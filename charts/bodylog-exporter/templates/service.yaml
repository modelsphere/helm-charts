apiVersion: v1
kind: Service
metadata:
  name: {{ include "bodylog-exporter.fullname" . }}
  labels:
    {{- include "bodylog-exporter.labels" . | nindent 4 }}
    {{- if .Values.serviceMonitor.jobName }}
    jobName: {{ .Values.serviceMonitor.jobName | quote }}   # read by ServiceMonitor.jobLabel to pin the Prometheus job label
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "bodylog-exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: exporter              # /metrics, the port the ServiceMonitor scrapes
      port: {{ .Values.port }}
      targetPort: exporter
