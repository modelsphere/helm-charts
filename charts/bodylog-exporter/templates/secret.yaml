{{- if .Values.secret.create }}
# Only created when secret.create=true. The default is create=false with
# existingSecret pointing at the listener's Secret, so the two cannot drift.
# Whatever value ends up here must match the listener's BODYLOG_HTTP_TOKEN, or
# the gap-filling call gets 401 and the records rotated out of the day's file
# are never picked up.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bodylog-exporter.fullname" . }}
  labels: {{- include "bodylog-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  BODYLOG_HTTP_TOKEN: {{ .Values.secret.token | quote }}
{{- end }}
