apiVersion: v2
name: higress-llm
description: "Gateway-wide plugins that put Higress in front of openresty as an OpenAI-compatible entry: model routing from the request body, per-caller API keys, token statistics, key swap to the upstream, tiered backends with spill, and cutting streams stuck in a repetition loop. Per-model routes and callers come from ModelFleet and APIConsumer objects via autoconfig"
home: https://github.com/modelsphere/helm-charts
sources:
  - https://github.com/modelsphere/helm-charts
  - https://github.com/modelsphere/higress
type: application
# No image of its own: the chart renders WasmPlugin and EnvoyFilter objects for a
# gateway installed by the upstream higress-core chart (higress.io/helm-charts).
# The plugins it points at are in values.yaml (plugins.*).
version: 0.1.1
keywords: [higress, wasm, llm-gateway, api-key, autoconfig]
