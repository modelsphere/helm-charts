apiVersion: v2
name: rdma-injector
description: >-
  Mutating admission webhook that spares workload manifests the RDMA boilerplate:
  pods labelled rdma-ib:"true" get the /etc/gpu-node mount and an NCCL_IB_HCA
  sourced from the node's healthy InfiniBand ports injected automatically.
  The webhook code is baked into the image; its serving certificate is
  self-signed by the chart at install time, so it installs into any namespace.
home: https://github.com/modelsphere/helm-charts
sources:
  - https://github.com/modelsphere/helm-charts
type: application
version: 0.2.3
appVersion: "0.2.0"
