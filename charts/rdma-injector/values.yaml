# The serving certificate is self-signed by Helm at install time, with a SAN of
# rdma-injector.<Release.Namespace>.svc, so the chart installs into whatever
# namespace `helm install -n <ns>` names. Nothing here hardcodes one.

image:
  repository: 4pdosc/rdma-injector
  tag: "0.2.0"                    # holds the webhook code only; the certificate is not baked in
  pullPolicy: IfNotPresent

# With failurePolicy=Fail this webhook sits on the critical path for pod
# creation, so run more than one. It cannot deadlock itself: it carries no
# rdma-ib label and its own namespace is excluded (see namespaceSelector).
replicas: 2

# Only pods carrying these labels are intercepted. Label whatever needs RDMA;
# this has nothing to do with which model runs there.
objectSelectorLabels:
  rdma-ib: "true"

# What happens to a labelled pod when the webhook is unreachable:
#   Fail   -- fail closed. A clear error beats silently starting a pod that
#             needed RDMA and did not get it. Recommended.
#   Ignore -- fail open. The pod is admitted, uninjected.
failurePolicy: Fail

# Validity of the self-signed certificate, in days. Signed once on install;
# later upgrades reuse the existing Secret rather than re-signing.
certValidityDays: 3650

resources:
  requests: { cpu: "50m", memory: "32Mi" }
  limits:   { cpu: "200m", memory: "128Mi" }
