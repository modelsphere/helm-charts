{{/*
  The serving certificate is self-signed with genSignedCert on first install
  (SAN rdma-injector.<ns>.svc). Upgrades look the existing Secret up and reuse
  it rather than re-signing, so the certificate does not churn.
  Note that lookup returns nothing under `helm template` and `--dry-run`, so a
  pure render mints a throwaway certificate. That does not affect a real apply.
*/}}
{{- $ns := .Release.Namespace -}}
{{- $svc := "rdma-injector" -}}
{{- $secretName := "rdma-injector-certs" -}}
{{- $cn := printf "%s.%s.svc" $svc $ns -}}
{{- $altNames := list $cn (printf "%s.%s.svc.cluster.local" $svc $ns) -}}
{{- $days := int .Values.certValidityDays -}}
{{- $prev := lookup "v1" "Secret" $ns $secretName -}}
{{- $data := dict -}}
{{- if $prev }}{{- $data = ($prev.data | default dict) }}{{- end -}}
{{- $caCrt := "" -}}{{- $tlsCrt := "" -}}{{- $tlsKey := "" -}}
{{- if hasKey $data "ca.crt" -}}
  {{- $caCrt = index $data "ca.crt" -}}
  {{- $tlsCrt = index $data "tls.crt" -}}
  {{- $tlsKey = index $data "tls.key" -}}
{{- else -}}
  {{- $ca := genCA "rdma-injector-ca" $days -}}
  {{- $cert := genSignedCert $cn nil $altNames $days $ca -}}
  {{- $caCrt = $ca.Cert | b64enc -}}
  {{- $tlsCrt = $cert.Cert | b64enc -}}
  {{- $tlsKey = $cert.Key | b64enc -}}
{{- end -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels: { app: rdma-injector }
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCrt }}
  tls.key: {{ $tlsKey }}
  ca.crt: {{ $caCrt }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata: { name: rdma-injector }
webhooks:
- name: rdma-injector.{{ $ns }}.svc
  clientConfig:
    service: { name: {{ $svc }}, namespace: {{ $ns }}, path: /mutate, port: 443 }
    caBundle: {{ $caCrt }}                          # the CA that signed the serving certificate in the Secret above
  rules:
  - operations: ["CREATE"]
    apiGroups: [""]
    apiVersions: ["v1"]
    resources: ["pods"]
    scope: "Namespaced"
  objectSelector:                                   # only pods carrying this label are intercepted
    matchLabels: {{ toYaml .Values.objectSelectorLabels | nindent 6 }}
  namespaceSelector:                                # belt and braces: never touch the webhook own namespace
    matchExpressions:
    - { key: kubernetes.io/metadata.name, operator: NotIn, values: [{{ $ns | quote }}] }
  failurePolicy: {{ .Values.failurePolicy }}
  sideEffects: None
  admissionReviewVersions: ["v1"]
  timeoutSeconds: 5
