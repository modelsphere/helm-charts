apiVersion: v1
kind: Service
metadata:
  name: {{ include "bodylog.fullname" . }}
  labels: {{- include "bodylog.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "bodylog.selectorLabels" . | nindent 4 }}
  ports:
    - name: frame                 # the router connects here to push frames; point the openresty chart's bodylog.host at this Service
      port: {{ .Values.ports.frame }}
      targetPort: frame
    - name: http                  # /summary, /metrics and /healthz, for scrapers and probes
      port: {{ .Values.ports.http }}
      targetPort: http
