{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bodylog.fullname" . }}
  labels: {{- include "bodylog.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Guards /summary and /metrics. Anything that scrapes those endpoints -- the
  # bodylog-exporter included -- must send the same value, or it gets 401 and
  # silently stops collecting. Empty disables authentication (testing only).
  # Pass the real value at install time: --set-string secret.token=<value>
  BODYLOG_HTTP_TOKEN: {{ .Values.secret.token | quote }}
{{- end }}
