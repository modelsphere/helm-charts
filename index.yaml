  llm-slo-decision-gen:
  - apiVersion: v2
    appVersion: 0.7.0
    created: "2026-10-14T00:10:32.69137322Z"
    description: 'LLM and async-job SLO stack: decision-gen (recommendation service),
      optional slo-api (SLO storage HTTP/UI), and the LLMSLORequirement and JobSLORequirement
      CRDs under inference.modelsphere.dev.  CRD ownership: this chart owns llmslorequirements.inference.modelsphere.dev
      and jobslorequirements.inference.modelsphere.dev (see crds/). Both CRDs carry
      helm.sh/resource-policy: keep so uninstall leaves them in the cluster — existing
      LLMSLORequirement / JobSLORequirement objects are not deleted with the release.
      Do not install a second chart that also ships these CRDs into the same cluster.  LLMScaler
      CRD and the operator that reconciles it are provided by a separate chart (llmscaleoperator
      / llmscaleoperator-system). Deploy that one first if you need autoscaling, not
      just SLO storage. '
    digest: 019207bb5370bb1973913fb3c268d7baa79b5927a85a9e979770a6a76263c885
    name: llm-slo-decision-gen
    type: application
    urls:
