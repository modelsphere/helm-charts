  llmscaleoperator:
  - apiVersion: v2
    appVersion: 0.4.0
    created: "2026-09-25T03:28:19.797287864Z"
    description: 'Kubernetes operator that autoscales LLM inference workloads on LLM-specific
      signals -- KV-cache utilization, queue depth, TPM/capacity load -- rather than
      CPU and memory. An HPA specialized for token serving.  Ships the LLMScaler CRD
      (autoscaling.modelsphere.dev/v1alpha1) and the controller that reconciles it.
      The SLO storage side lives in the llm-slo-decision-gen chart; the two are independent,
      and this one is what you need for autoscaling alone.  Generated from the llm-operator
      repo (dist/chart, kubebuilder helm plugin) and maintained here, because this
      is where charts are published from. '
